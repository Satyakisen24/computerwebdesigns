---
deployment:
  tasks:
    # Set deployment path (replace YOUR_CPANEL_USERNAME with your actual cPanel username)
    - export DEPLOYPATH=/home/epodesn7/public_html/
    
    # Sync all files to the deploy path, excluding git-specific metadata
    - /bin/rsync -avz --exclude '.git' --exclude '.cpanel.yml' ./ $DEPLOYPATH
    
    # Automatically fix permissions of public_html after sync
    - /bin/chmod 755 /home/epodesn7/public_html
